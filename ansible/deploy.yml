- name: Deploy MERN Stack Application
  hosts: production
  tasks:
    - name: Ensure project directory exists on server
      ansible.builtin.file:
        path: /home/ubuntu/mern-ecommerce
        state: directory

   
    - name: Copy docker-compose file to server
      ansible.builtin.copy:
        src: ../docker-compose.yml  
        dest: /home/ubuntu/mern-ecommerce/docker-compose.yml

    - name: Pull and restart docker compose
      ansible.builtin.shell: |
        cd /home/ubuntu/mern-ecommerce
        docker compose pull || true
        docker compose up -d --build