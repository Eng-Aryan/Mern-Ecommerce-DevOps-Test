---
- name: Deploy MERN Stack Application
  hosts: production
  become: yes
  tasks:
    - name: Ensure project directory exists
      ansible.builtin.file:
        path: /home/ubuntu/mern-ecommerce
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Clone or pull latest code from GitHub
      ansible.builtin.git:
        repo: 'https://github.com/Eng-Aryan/Mern-Ecommerce-DevOps-Test.git'
        dest: /home/ubuntu/mern-ecommerce
        version: main
        force: yes
        update: yes

    - name: Pull and restart docker compose
      ansible.builtin.shell: |
        cd /home/ubuntu/mern-ecommerce
        docker compose pull || true
        docker compose up -d --build