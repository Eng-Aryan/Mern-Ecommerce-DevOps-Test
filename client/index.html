    <script>
      // apply the saved theme before first paint so there is no white flash in dark mode
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
  </head>

      <p style="font-family:system-ui,sans-serif;padding:2rem;color:#0e3b43">Loading…</p>
